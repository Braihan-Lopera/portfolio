services:
  portfolio:
    build: .
    image: portfolio-ui:latest
    container_name: portfolio
    restart: unless-stopped

    # Sin publicar puertos en el host: el sitio SOLO es accesible por la red
    # interna 'edge', a la que también se conecta cloudflared. Nada queda
    # expuesto en la LAN — el único camino de entrada es el túnel.
    networks:
      - edge

    # ---- Endurecimiento de seguridad ----
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

# Red compartida con cloudflared. Se crea una sola vez con:
#   docker network create edge
networks:
  edge:
    external: true
