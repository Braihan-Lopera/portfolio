services:
  portfolio:
    build: .
    image: portfolio-ui:latest
    container_name: portfolio
    restart: unless-stopped

    # host:contenedor — el contenedor escucha en 8080 (nginx no-root).
    # Cambia el puerto del host (izquierda) si 8080 ya está ocupado.
    ports:
      - "8080:8080"

    # ---- Endurecimiento de seguridad ----
    # No permitir que el proceso gane privilegios nuevos.
    security_opt:
      - no-new-privileges:true
    # Quitar TODAS las capabilities de Linux: un sitio estático no necesita ninguna.
    cap_drop:
      - ALL
    # Sistema de archivos de solo lectura; nginx solo necesita escribir temporales.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
