server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    # No revelar la versión de nginx en las respuestas.
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---- Compresión ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/xml;

    # ---- Cabeceras de seguridad (se aplican a todas las respuestas) ----
    # Evita que el navegador "adivine" tipos MIME (defensa anti-XSS).
    add_header X-Content-Type-Options "nosniff" always;
    # Impide que el sitio se cargue dentro de un <iframe> ajeno (anti-clickjacking).
    add_header X-Frame-Options "DENY" always;
    # Controla cuánta info de origen se envía al navegar a otros sitios.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Desactiva APIs sensibles del navegador que el sitio no usa.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    # Whitelist de qué puede cargar la página. Es la defensa más fuerte
    # contra inyección de scripts. Ajustada a lo que usa el sitio:
    #   - scripts/estilos/imágenes propios ('self')
    #   - fuentes de Google Fonts (googleapis + gstatic)
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self'" always;

    # ---- Cache de assets con hash en el nombre (inmutables) ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- SPA: cualquier ruta desconocida devuelve index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El index nunca se cachea, para servir siempre la última versión.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---- Bloquear acceso a archivos ocultos (.env, .git, etc.) ----
    location ~ /\. {
        deny all;
        return 404;
    }
}
